[project]
name = "minillm-engine"
version = "0.1.0"
description = "A minimal LLM engine for learning and experimentation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainer"]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu130"
